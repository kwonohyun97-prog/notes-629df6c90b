      ${sayBox("Hi! Could you take us to this address, please?", "¡Hola! ¿Nos lleva a esta dirección, por favor?", "", { big: true })}
      <div class="big">${esc(t.name)}</div>${t.addr ? `<div class="big addr" style="font-size:26px">${esc(t.addr)}</div>` : ""}
      <div class="ko">기사님께 이 화면을 보여주세요</div></div>`;
    $("#ride").hidden = true; $("#taxi").hidden = false; $("#taxi .close").focus();
  }

  /* ---------- 앱 화면 전체 확대 막기 ----------
     아이폰은 두 손가락 · 두 번 톡으로 화면 전체를 확대하면 고정된 머리띠 · 하단 바 구조에서 엉뚱한 곳(오른쪽 위)을 크게 보여줌.
     지도는 지도 안에서 따로 확대 · 축소함. */
  ["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener("touchmove", e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });

  /* ---------- 탭 ---------- */
  const VIEWS = ["today", "plan", "wallet", "food", "more"];
  const RENDER = { today: renderToday, plan: renderPlan, wallet: renderWallet, food: renderFood, more: renderMore };
  const scrollMem = {}; let curView = null;
  function moveInd(v, instant) {
    const ind = $(".tabs .ind"), b = $(`.tabs button[data-tab="${v}"]`); if (!ind || !b) return;
    if (instant) ind.classList.add("noanim");
    ind.style.width = b.offsetWidth + "px"; ind.style.transform = `translateX(${b.offsetLeft}px)`;
    if (instant) { void ind.offsetWidth; ind.classList.remove("noanim"); }
  }
  // 앱 높이를 실제 보이는 화면 높이에 맞추고, 하단 바가 화면 바닥보다 떠 있으면 바닥에 붙이기 (아이폰 기종 · 상황별 차이 보정)
  addEventListener("resize", () => { if (curView) moveInd(curView, true); });
  // 화면 전체는 항상 맨 위에 고정 (스크롤은 탭 화면 안에서만)
  // 아이폰 맨 위 시계(상태바)를 톡 → 지금 보는 탭을 맨 위로.
  // 아이폰은 시계를 누르면 '문서'를 맨 위로 올림 → 문서를 1px 내려두고(park), 0이 되는 순간 지금 탭을 맨 위로 올린 뒤 다시 1px 내려둠
  let parking = false;
  const park = () => { if (window.scrollY !== 1) { parking = true; window.scrollTo(0, 1); requestAnimationFrame(() => requestAnimationFrame(() => { parking = false; })); } };
  const viewTop = () => { const v = curView && $("#v-" + curView); if (v && v.scrollTop > 0) v.scrollTo({ top: 0, behavior: REDUCE ? "auto" : "smooth" }); };
  addEventListener("scroll", () => {
    if (parking) return;
    if (window.scrollY <= 0) { viewTop(); setTimeout(park, 350); }
    else if (window.scrollY !== 1) park();
  }, { passive: true });
  addEventListener("pageshow", () => setTimeout(park, 50));
  setTimeout(park, 0); setTimeout(park, 600);
  // 앱 맨 위 머리띠(제목 · 시계)를 눌러도 맨 위로
  $(".top").addEventListener("click", viewTop);
  // 여행 중에는 일정 · 티켓 · 식당 탭을 열 때 '지금'에 맞는 날짜와 끼니로 맞춤 (직접 고른 지 10분이 안 지났으면 그대로)
  const picked = { plan: 0, wallet: 0, food: 0 };
  function nowMealKey() {   // 오후 3시 전 → 오늘 점심, 그 뒤 → 오늘 저녁, 밤 9시 반 넘으면 → 내일 점심 (없으면 다음 끼니)
    const { idx, now } = tripDay();
    const di = now >= 21 * 60 + 30 ? idx + 1 : idx, target = di * 2 + (now >= 15 * 60 && now < 21 * 60 + 30 ? 1 : 0);
    const ord = m => dayIdx(mealDate(m)) * 2 + (mealSlot(m) === "dinner" ? 1 : 0);
    const pick = D.meals.slice().sort((a, b) => ord(a) - ord(b)).find(m => ord(m) >= target);
    return pick ? pick.key : null;
  }
  function autoPick(v) {
    const { idx } = tripDay();
    if (!(v in picked) || idx < 1 || idx > 10 || Date.now() - picked[v] < 10 * 60e3) return false;
    if (v === "plan") planDay = idx;
    else if (v === "wallet") walletDay = null;   // 오늘(없으면 다음 날) 티켓
    else if (v === "food") mealKey = nowMealKey() || mealKey;
    return true;
  }
  function show(v, fromTab) {
    if (!VIEWS.includes(v)) v = "today";
    if (fromTab && v === curView) { $("#v-" + v).scrollTo({ top: 0, behavior: REDUCE ? "auto" : "smooth" }); return; }   // 같은 탭 한 번 더 → 맨 위로
    if (curView) scrollMem[curView] = $("#v-" + curView).scrollTop;
    VIEWS.forEach(x => { $("#v-" + x).hidden = x !== v; });
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === v ? "page" : "false"));
    moveInd(v, !curView);
    $("#title").textContent = TITLES[v];
    destroyMaps();
    delete lastKey["v-" + v];
    const auto = autoPick(v);
    RENDER[v]();
    $("#v-" + v).scrollTop = fromTab && v !== "more" && !auto ? (scrollMem[v] || 0) : 0;   // 더보기는 항상 접힌 채 맨 위부터
    curView = v;
    if (auto && v === "plan") { const nowEl = $("#v-plan .ev.now"); if (nowEl) reveal(nowEl, false); }   // 지금 일정이 보이게
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("button, a");
    if (!b) { const ev = e.target.closest("[data-route]"); if (ev) showRoute(ev); return; }
    const ds = b.dataset;
    if (ds.tab) show(ds.tab, true);
    else if (ds.go) show(ds.go);
    else if (ds.plan) { planDay = +ds.plan; picked.plan = Date.now(); show("plan"); }
    else if (ds.day) { planDay = +ds.day; picked.plan = Date.now(); destroyMaps(); renderPlan(); }
    else if (ds.fly) { const [fd, fi, fk] = ds.fly.split(":"); const m = MAPS[fd + ":v-plan"] || MAPS[fd + ":v-today"]; if (m) m.fly(+fi, fk === undefined ? -1 : +fk); }
    else if (ds.taxiplan !== undefined) openTaxiPlan(+ds.taxiplan);
    else if (ds.meal) { mealKey = ds.meal; picked.food = Date.now(); if ($("#v-food").hidden) show("food"); else renderFood(); }
    else if (ds.wday) { walletDay = +ds.wday; picked.wallet = Date.now(); if ($("#v-wallet").hidden) show("wallet"); else renderWallet(); }
    else if (ds.install) { if (window.__showInstall) window.__showInstall(); }
    else if (ds.tf) { document.documentElement.dataset.tf = ds.tf; store.set("tf", ds.tf); renderMore(); }
    else if (ds.ck) { document.documentElement.dataset.ck = ds.ck; store.set("ck", ds.ck); renderMore(); }
    else if (ds.ride) openRide(ds.ride);
    else if (ds.taxicard) { if (rideCur) openTaxi(rideCur); }
    else if (ds.close) $("#" + ds.close).hidden = true;
    else if (ds.tix) openTix(ds.tix, +(ds.tixi || 0));
    else if (ds.gow) goWallet(+ds.gow);
    else if (ds.pdf) openPdf(b);
    else if (ds.tixgo !== undefined) { const r = $("#tix .tixrail"); if (r) r.scrollLeft = +ds.tixgo * r.clientWidth; }
    else if (ds.lang) { const es = b.closest(".say2").querySelector(".es2"); es.hidden = !es.hidden; b.setAttribute("aria-pressed", String(!es.hidden)); b.textContent = es.hidden ? "🇪🇸 스페인어" : "스페인어 숨기기"; }
    else if (ds.fx) { const e = $("#fx-eur"); if (e) { e.value = ds.fx; fxCalc("eur"); } }
    else if (ds.opttoggle) { const body = b.nextElementSibling, open = body.hidden; body.hidden = !open; b.setAttribute("aria-expanded", String(open)); optOpen = open ? ds.opttoggle : ""; }
    else if (ds.optset) { const [od, os, ov] = ds.optset.split(":"), k = `opt:${od}:${os}`; store.set(k, store.get(k, "") === ov ? "" : ov); optOpen = `${od}:${os}`; renderPlan(); }
    else if (ds.wxrefresh) refreshWx(b);
    else if (ds.copy !== undefined) copy(ds.copy, b);
  });
  document.addEventListener("input", e => { if (e.target.id === "fx-eur") fxCalc("eur"); else if (e.target.id === "fx-krw") fxCalc("krw"); });
  // 인터넷 끊기면 맨 위에 '오프라인' 배지 · 다시 연결되면 날씨 새로 받기
  const netUpd = () => { const o = $("#offl"); if (o) o.hidden = navigator.onLine !== false; };
  addEventListener("offline", netUpd);
  addEventListener("online", () => { netUpd(); if (curView === "today" || curView === "plan") fillWx($("#v-" + curView)); if (curView === "today") fillNow($("#v-today")); });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && curView === "today") { fillWx($("#v-today")); fillNow($("#v-today")); } });
  netUpd();
  document.addEventListener("change", e => {
    const c = e.target.closest("[data-check]"); if (!c) return;
    const all = store.get("checks", {}); all[c.dataset.check] = c.checked; store.set("checks", all);
  });
  function showRoute(el) {
    const [d, p, k] = el.dataset.route.split(":").map(Number);
    const m = MAPS[d + ":v-plan"]; if (!m) return;
    el.closest(".tl").querySelectorAll(".ev.on").forEach(x => x.classList.remove("on")); el.classList.add("on");
    m.route(p, k);
  }
  document.addEventListener("keydown", e => { const ev = e.target.closest && e.target.closest("[data-route]"); if (ev && (e.key === "Enter" || e.key === " ") && e.target === ev) { e.preventDefault(); showRoute(ev); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape") ["taxi", "ride", "tix"].forEach(id => $("#" + id).hidden = true); });

  { const tf = store.get("tf", null); if (tf && (D.titleOpts || []).some(t => t.id === tf)) document.documentElement.dataset.tf = tf; }
  { const ck = SHOW_CK && store.get("ck", null); document.documentElement.dataset.ck = ck && CK_OPTS.some(t => t.id === ck) ? ck : CK_DEFAULT; }
  tick(); setInterval(() => { tick(); }, 30000);
  const h = location.hash.replace("#", "");
  ["tab", "planDay", "meal", "walletDay"].forEach(k => { try { localStorage.removeItem("es26:" + k); } catch (e) {} });   // 예전 버전이 남긴 위치 기록 정리
  show(VIEWS.includes(h) ? h : "today");
})();
</script>
</template>
<script>
(() => {
  const KEY = "es26:key", BUILD = "0aeedbff0b";
  const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const tob64 = u => btoa(String.fromCharCode(...u));
  const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const put = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.standalone === true || matchMedia("(display-mode: standalone)").matches) document.getElementById("lockhelp").hidden = true;   // 이미 설치된 앱에서는 설치 안내 숨김
  let ENC = null;
  async function loadEnc() {
    if (!ENC) ENC = await (await fetch("data.enc", { cache: "no-cache" })).json();
    return ENC;
  }
  async function derive(pw, enc) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: ub64(enc.salt), iterations: enc.iter }, base, 256));
  }
  async function open(raw, enc) {
    const k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(enc.iv) }, k, ub64(enc.ct));
    const stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(stream).text();
  }
  function boot(json, k) {
    window.__es26k = k;   // 원본 PDF(f/*.bin) 풀 때 앱이 씀 (메모리에만)
    document.getElementById("lock").hidden = true;
    const frag = document.getElementById("appshell").content.cloneNode(true);
    const scripts = [...frag.querySelectorAll("script")];
    scripts.forEach(s => s.remove());
    document.body.appendChild(frag);
    scripts.forEach(s => {
      const n = document.createElement("script");
      if (s.id === "data") { n.id = "data"; n.type = "application/json"; n.textContent = json; }
      else n.textContent = s.textContent;
      document.body.appendChild(n);
    });
    if (window.__autoInstall) window.__autoInstall();
  }
  async function start() {
    let enc;
    try { enc = await loadEnc(); } catch (e) { showLock("인터넷에 연결된 상태에서 처음 한 번 열어주세요"); return; }
    if (enc.build && enc.build !== BUILD) {   // 화면이 옛 버전이면 한 번만 새로 받기
      let done = null; try { done = sessionStorage.getItem("es26:reload"); } catch (e) {}
      if (done !== enc.build) { try { sessionStorage.setItem("es26:reload", enc.build); } catch (e) {} location.replace(location.pathname + "?v=" + enc.build); return; }
    }
    const saved = get(KEY);
    if (saved) { try { boot(await open(ub64(saved), enc), ub64(saved)); return; } catch (e) { put(KEY, null); } }
    showLock("");
  }
  function showLock(msg) {
    document.getElementById("lock").hidden = false;
    document.getElementById("err").textContent = msg;
    setTimeout(() => document.getElementById("pw").focus(), 50);
  }
  document.getElementById("lockform").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = document.getElementById("go"), err = document.getElementById("err");
    btn.disabled = true; btn.textContent = "여는 중…"; err.textContent = "";
    try {
      const enc = await loadEnc();
      const raw = await derive(document.getElementById("pw").value.trim(), enc);
      const json = await open(raw, enc);
      if (document.getElementById("remember").checked) put(KEY, tob64(raw));
      boot(json, raw);
    } catch (x) {
      err.textContent = "비밀번호가 맞지 않아요";
      btn.disabled = false; btn.textContent = "열기";
    }
  });
  start();
})();
</script>
