<style>
:root { --g1: #0B3A8F; --g2: #1769D0; --g3: #22B5C0; --glow: rgba(255,255,255,.22); }
@media (prefers-color-scheme: dark) { :root { --g1: #0A2463; --g2: #1849A6; --g3: #0F7C8C; --glow: rgba(255,255,255,.1); } }
html, body { margin: 0; }
@media (display-mode: standalone) { html { min-height: min(100lvh, calc(100% + env(safe-area-inset-top, 0px))); } }   /* iOS 26 WebKit 버그 301108: 홈 화면 앱 화면 높이가 상태바만큼 짧게 잡히는 것 바로잡기 */
img { max-width: 100%; }
[hidden] { display: none !important; }
#lock { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px 16px; color: #fff; overflow-y: auto;
  background: radial-gradient(120% 80% at 100% 0%, var(--glow), transparent 55%), linear-gradient(160deg, var(--g1), var(--g2) 55%, var(--g3));
  font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
#lock .box { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
#lock .li { display: block; width: 92px; height: 92px; border-radius: 22px; margin: 0 auto; box-shadow: 0 10px 28px -10px rgba(0,0,0,.45), 0 0 0 3px rgba(255,255,255,.35); }
#lock h1 { font-family: "Jua", sans-serif; font-weight: 400; font-size: 31px; line-height: 1.2; margin: 0; text-shadow: 0 1px 3px rgba(0,0,0,.15); }
#lock p { margin: 0; font-size: 17px; opacity: .9; }
#lock input { font-size: 26px; text-align: center; letter-spacing: .15em; padding: 14px; border-radius: 14px; border: 0; width: 100%; box-sizing: border-box; background: #fff; color: #16202C; box-shadow: 0 6px 18px -8px rgba(0,0,0,.35); }
#lock button { font-size: 19px; font-weight: 700; min-height: 56px; border-radius: 14px; border: 0; background: rgba(0,0,0,.28); color: #fff; cursor: pointer; }
#lock #lockhelp { background: rgba(255,255,255,.16); color: #fff; min-height: 0; text-decoration: none; border-radius: 999px; padding: 10px 18px; font-size: 15px; align-self: center; }
#lock label { font-size: 16px; display: flex; gap: 8px; justify-content: center; align-items: center; }
#lock label input { width: 22px; height: 22px; }
#lock .err { color: #fff; font-weight: 700; min-height: 1.4em; }
#lock .err:not(:empty) { background: rgba(0,0,0,.3); border-radius: 10px; padding: 6px 10px; }
</style>
</head><body>
<div id="lock" hidden>
  <form class="box" id="lockform" autocomplete="off">
    <img class="li" src="icon-192.d24e61ab.png" alt="">
    <h1>🇪🇸 스페인 가족여행 일정</h1>
    <p>가족 비밀번호를 입력하세요</p>
    <input id="pw" type="password" inputmode="numeric" pattern="[0-9]*" aria-label="비밀번호" required>
    <label for="remember"><input id="remember" type="checkbox" checked> 이 휴대폰에서 기억하기</label>
    <button type="submit" id="go">열기</button>
    <div class="err" id="err" aria-live="polite"></div>
    <button type="button" id="lockhelp" onclick="window.__showInstall && window.__showInstall()">홈 화면에 설치하는 방법</button>
  </form>
</div>
<!-- 설치 도우미: 홈 화면에 앱으로 설치하는 방법 (아이폰 / 안드로이드 / 카카오톡) -->
<style>
#install { position: fixed; inset: 0; z-index: 60; background: rgba(10, 16, 24, .55); display: flex; align-items: flex-end; justify-content: center;
  font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
#install .sheet { width: 100%; max-width: 560px; background: #FFFFFF; color: #16202C; border-radius: 22px 22px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 92vh; overflow-y: auto; }
@media (prefers-color-scheme: dark) { #install .sheet { background: #151C25; color: #ECF0F5; } #install .step { background: #1D2631; } #install .ghost { background: #1D2631 !important; color: #ECF0F5 !important; } }
#install h2 { margin: 0; font-size: 22px; }
#install p { margin: 0; font-size: 17px; line-height: 1.5; }
#install .steps { display: flex; flex-direction: column; gap: 10px; }
#install .step { display: grid; grid-template-columns: 34px 1fr 52px; gap: 12px; align-items: center; background: #EEF2F6; border-radius: 14px; padding: 12px; }
#install .num { width: 30px; height: 30px; border-radius: 50%; background: #1F4E8C; color: #fff; font-weight: 700; display: grid; place-items: center; font-size: 16px; }
#install .txt { font-size: 18px; line-height: 1.4; }
#install .txt b { color: #D2334A; }
#install .ico { width: 48px; height: 48px; border-radius: 12px; background: #fff; display: grid; place-items: center; border: 1px solid #DCE2EA; }
#install .ico svg { width: 28px; height: 28px; stroke: #1F7AE0; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#install .ico .dots { font-size: 26px; font-weight: 800; color: #1F7AE0; letter-spacing: 1px; line-height: 1; }
#install .big { min-height: 58px; border-radius: 14px; border: 0; background: #1F4E8C; color: #fff; font-size: 19px; font-weight: 700; cursor: pointer; width: 100%; }
#install .row { display: flex; gap: 8px; }
#install.ios .sheet { padding-bottom: calc(66px + env(safe-area-inset-bottom, 0px)); }
#install .ghost { flex: 1; min-height: 48px; border-radius: 12px; border: 0; background: #EEF2F6; color: #16202C; font-size: 16px; font-weight: 700; cursor: pointer; }
#install .note { font-size: 15px; opacity: .75; }
#pointer { position: fixed; z-index: 61; right: 14px; bottom: calc(6px + env(safe-area-inset-bottom, 0px)); font-size: 44px; line-height: 1; pointer-events: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,.35)); }
@media (prefers-reduced-motion: no-preference) { #pointer { animation: bob 1s ease-in-out infinite; } @keyframes bob { 50% { transform: translateY(8px); } } }
#lockhelp { background: none; border: 0; color: #1F4E8C; font-size: 17px; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 8px; }
</style>
<div id="install" hidden role="dialog" aria-modal="true" aria-label="홈 화면에 설치하기"><div class="sheet" id="installbody"></div></div>
<div id="pointer" hidden aria-hidden="true">👇</div>
<script>
(() => {
  const ua = navigator.userAgent;
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);
  const isKakao = /KAKAOTALK/i.test(ua);
  const inApp = isKakao || /NAVER|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|; wv\)/i.test(ua);
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  let deferred = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; });
  window.addEventListener("appinstalled", () => { put("es26:installed", "1"); hide(); });
  const ICON = {
    share: '<svg viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>',
    add: '<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/></svg>',
    dots: '<span class="dots">···</span>',
    check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
    menu: '<span class="dots">⋮</span>',
    more: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h.01M12 12h.01M16 12h.01" stroke-width="3"/></svg>',
    burger: '<span class="dots">≡</span>'
  };
  const isSamsung = /SamsungBrowser/i.test(ua);
  const step = (n, html, icon) => `<div class="step"><span class="num">${n}</span><span class="txt">${html}</span><span class="ico">${icon}</span></div>`;
  function body() {
    const url = location.href.split("#")[0];
    if (inApp) {
      return `<h2>사파리(Safari)에서 열어야 설치돼요</h2>
        <p>지금은 ${isKakao ? "카카오톡" : "다른 앱"} 안에서 열려 있어서 홈 화면에 설치할 수 없어요.</p>
        ${isKakao ? `<button class="big" id="openext">${isIOS ? "사파리로 열기" : "크롬으로 열기"}</button>` : ""}
        <p class="note">버튼이 안 되면: 화면 오른쪽 아래(또는 위) <b>···</b> 메뉴 → <b>${isIOS ? "Safari로 열기" : "다른 브라우저로 열기"}</b></p>`;
    }
    if (isIOS) {
      return `<h2>홈 화면에 앱으로 설치하기</h2>
        <div class="steps">
          ${step(1, "화면 맨 아래 주소창 오른쪽의 <b>···</b> 버튼 누르기", ICON.dots)}
          ${step(2, "<b>공유</b> 누르기", ICON.share)}
          ${step(3, "공유 창에서 <b>더 보기</b> 누르기", ICON.more)}
          ${step(4, "<b>홈 화면에 추가</b> 누르기", ICON.add)}
          ${step(5, "<b>웹 앱으로 열기</b>가 켜진 채로 오른쪽 위 <b>추가</b>", ICON.check)}
        </div>
        <p class="note">아래쪽 막대가 안 보이면 화면 맨 아래를 한 번 톡 눌러주세요. 공유 창에 <b>홈 화면에 추가</b>가 바로 보이면 3번은 건너뛰면 돼요. 예전 아이폰은 맨 아래 가운데 <b>공유</b> 버튼부터 시작하세요.</p>`;
    }
    if (isAndroid) {
      return `<h2>홈 화면에 앱으로 설치하기</h2>
        ${deferred ? `<button class="big" id="doinstall">앱으로 설치하기</button><p class="note">누른 뒤 나오는 창에서 <b>설치</b>를 누르면 끝이에요.</p>`
          : isSamsung
            ? `<div class="steps">${step(1, "화면 아래 <b>≡</b> 메뉴 누르기", ICON.burger)}${step(2, "<b>페이지 추가</b> 누르기", ICON.add)}${step(3, "<b>홈 화면</b> 고르기", ICON.check)}</div><p class="note">주소창에 설치(↓) 아이콘이 보이면 그걸 눌러도 돼요.</p>`
            : `<div class="steps">${step(1, "오른쪽 위 <b>⋮</b> 메뉴 누르기", ICON.menu)}${step(2, "<b>앱 설치</b> 또는 <b>홈 화면에 추가</b> 누르기", ICON.add)}${step(3, "<b>설치</b> 누르기", ICON.check)}</div>`}`;
    }
    return `<h2>휴대폰에서 열어주세요</h2><p>아이폰은 사파리, 안드로이드는 크롬으로 이 주소를 열면 홈 화면에 설치할 수 있어요.</p>`;
  }
  function show(auto) {
    if (standalone) return;
    const el = document.getElementById("installbody");
    el.innerHTML = body() + `<div class="row"><button class="ghost" id="later">나중에</button>${auto ? '<button class="ghost" id="never">다시 보지 않기</button>' : ""}</div>`;
    document.getElementById("install").hidden = false;
    document.getElementById("install").classList.toggle("ios", isIOS && !inApp);
    document.getElementById("pointer").hidden = !(isIOS && !inApp);
    const ext = document.getElementById("openext");
    if (ext) ext.onclick = () => { location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href.split("#")[0]); };
    const ins = document.getElementById("doinstall");
    if (ins) ins.onclick = async () => { deferred.prompt(); const r = await deferred.userChoice; deferred = null; if (r.outcome === "accepted") hide(); else show(auto); };
    document.getElementById("later").onclick = () => { sessionStorage.setItem("es26:later", "1"); hide(); };
    const nv = document.getElementById("never"); if (nv) nv.onclick = () => { put("es26:noinstall", "1"); hide(); };
  }
  function hide() { document.getElementById("install").hidden = true; document.getElementById("pointer").hidden = true; }
  window.__showInstall = () => show(false);
  window.__autoInstall = () => {
    let later = null; try { later = sessionStorage.getItem("es26:later"); } catch (e) {}
    if (!standalone && !get("es26:noinstall") && !get("es26:installed") && !later) setTimeout(() => show(true), isAndroid ? 1200 : 600);
  };
  // 카카오톡 안에서 열렸으면 잠금 화면보다 먼저 안내
  if (inApp && !standalone) setTimeout(() => show(false), 300);
})();
</script>

<template id="appshell"><title>🇪🇸 스페인 가족여행 일정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  color-scheme: light;
  --bg: #F3F6FA;
  --surface: #FFFFFF;
  --surface-2: #EDF1F6;
  --ink: #131B27;
  --muted: #586374;
  --line: #DFE5EC;
  --accent: #1769D0;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3EDFB;
  --g1: #0B3A8F; --g2: #1769D0; --g3: #22B5C0;   /* 머리띠 그라데이션 */
  --glow: rgba(255,255,255,.24);
  --btn1: #0B3A8F; --btn2: #1769D0;
  --star: #A85F00;
  --ok: #1F7A48;
  --ok-soft: #E2F3E9;
  --warn: #A9520A;
  --warn-soft: #FBEBDD;
  --todo: #9A3434;
  --todo-soft: #F7E3E3;
  --c-move: #2F6FB3;
  --c-see: #2E8556;
  --c-eat: #B86F0B;
  --c-match: #C23E48;
  --c-stay: #6E54AD;
  --c-free: #6B7480;
  --route: #D2334A;
  --uber: #000000;
  --uber-ink: #FFFFFF;
  --shadow: 0 1px 2px rgba(19, 27, 39, .05), 0 6px 18px rgba(19, 27, 39, .06);
  --hero-shade: 72%;
  --display: "Gothic A1", var(--sans);
  --display-w: 800;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
/* 다크 모드: 밤에 눈부시지 않게 깊은 남색 바탕 + 차분한 머리띠 */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #0A0F1A; --surface: #121A28; --surface-2: #1A2435; --ink: #E9EEF6; --muted: #9AA7BA; --line: #243045;
  --accent: #7DB3FF; --accent-ink: #0A0F1A; --accent-soft: #16294A;
  --g1: #0A2463; --g2: #1849A6; --g3: #0F7C8C; --glow: rgba(255,255,255,.12); --btn1: #1A4FB0; --btn2: #1E74C8;
  --star: #F0B65A; --ok: #62C690; --ok-soft: #14301F; --warn: #EDA05A; --warn-soft: #36240F; --todo: #F08A8A; --todo-soft: #3A1C1F;
  --c-move: #7FB0EA; --c-see: #6DC495; --c-eat: #E8AE55; --c-match: #EE7F87; --c-stay: #AE98EA; --c-free: #9AA6B5;
  --uber: #FFFFFF; --uber-ink: #000000;
  --shadow: 0 6px 18px rgba(0, 0, 0, .35);
  --hero-shade: 62%;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0A0F1A; --surface: #121A28; --surface-2: #1A2435; --ink: #E9EEF6; --muted: #9AA7BA; --line: #243045;
  --accent: #7DB3FF; --accent-ink: #0A0F1A; --accent-soft: #16294A;
  --g1: #0A2463; --g2: #1849A6; --g3: #0F7C8C; --glow: rgba(255,255,255,.12); --btn1: #1A4FB0; --btn2: #1E74C8;
  --star: #F0B65A; --ok: #62C690; --ok-soft: #14301F; --warn: #EDA05A; --warn-soft: #36240F; --todo: #F08A8A; --todo-soft: #3A1C1F;
  --c-move: #7FB0EA; --c-see: #6DC495; --c-eat: #E8AE55; --c-match: #EE7F87; --c-stay: #AE98EA; --c-free: #9AA6B5;
  --uber: #FFFFFF; --uber-ink: #000000;
  --shadow: 0 6px 18px rgba(0, 0, 0, .35);
  --hero-shade: 62%;
}
:root[data-tf="a1"], .tfopt[data-tf="a1"] { --title-font: "Gothic A1", var(--sans); --title-w: 800; --title-size: 31px; --title-ls: -.01em; }
:root[data-tf="bhs"], .tfopt[data-tf="bhs"] { --title-font: "Black Han Sans", var(--sans); --title-w: 400; --title-size: 34px; --title-ls: 0; }
:root, :root[data-tf="jua"], .tfopt[data-tf="jua"] { --title-font: "Jua", var(--sans); --title-w: 400; --title-size: 33px; --title-ls: 0; }
:root[data-tf="dohyeon"], .tfopt[data-tf="dohyeon"] { --title-font: "Do Hyeon", var(--sans); --title-w: 400; --title-size: 38px; --title-ls: 0; }
html { background: var(--bg); }
html, body { overscroll-behavior: none; }
/* iOS 26 WebKit 버그 301108: 홈 화면 앱(상태바 투명)은 화면 높이를 상태바만큼 짧게 잡아 하단 바가 뜸.
   문서를 상태바만큼 더 길게 요청하면 아이폰이 원래 높이를 돌려주고, 그 뒤로는 이 줄이 100%와 같아져 효과 없음 (사파리 · 안드로이드 영향 없음) */
@media (display-mode: standalone) { html { min-height: min(100lvh, calc(100% + env(safe-area-inset-top, 0px))); } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body::after { content: ""; display: block; height: 1px; }   /* 문서를 1px 길게 → 아이폰 시계(상태바) 톡 감지용 */
.top { cursor: pointer; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.5; -webkit-text-size-adjust: 100%; word-break: keep-all; overflow-wrap: break-word; }
/* 제목은 두 줄일 때 위아래 길이를 비슷하게, 설명은 끝에 한 단어만 남지 않게 */
.h2, .ev .ti, .place .nm, .wcard .ti, .stay .nm, .next .ti, .dest { text-wrap: balance; }
.no, .muted, .note, .one, .kv dd, .pl, p { text-wrap: pretty; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
/* 아이폰: 버튼을 빨리 두 번 눌러도 화면이 확대되지 않게 (두 손가락 확대는 그대로) */
html, body, .app, main, .view, button, a, .btn, .tabs, .days, .seg, [data-route], .overlay { touch-action: manipulation; }   /* 두 번 톡 확대 막기 (스크롤 칸마다 따로 지정해야 적용됨) */
.tabs { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.app { max-width: 600px; margin: 0 auto; padding-inline: 16px; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }   /* 꼭 화면 전체 높이(100dvh) — innerHeight로 맞추면 아이폰 홈 화면 앱에서 하단 바가 뜸 */
.top { touch-action: none; }   /* 머리띠를 끌어서 화면 전체가 밀리지 않게 */
/* 탭마다 따로 스크롤 (인스타처럼): 페이지 전환 때 스크롤을 옮기지 않아서 아이폰에서 깜빡이지 않음 · 보던 위치도 탭마다 기억 */
main { flex: 1; min-height: 0; position: relative; margin: -24px -16px 0; }
.view { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior-y: contain; -webkit-overflow-scrolling: touch; padding: 24px 16px 104px; }
small.ap { font-size: .72em; font-weight: 700; margin-right: 2px; letter-spacing: 0; font-family: var(--sans); }

/* 상단 */
.top { position: relative; flex: none; z-index: 5; margin-inline: -16px; padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 15px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; color: #fff;
  background: var(--g1);
  background: radial-gradient(120% 170% at 100% 0%, var(--glow), transparent 55%), linear-gradient(120deg, var(--g1), var(--g2) 58%, var(--g3));
  border-radius: 0 0 24px 24px; box-shadow: 0 10px 24px -14px var(--g1); }
.top .brand { font-size: 13px; font-weight: 700; letter-spacing: .02em; opacity: .92; white-space: nowrap; }
.top h1 { font-family: var(--title-font, var(--display)); font-weight: var(--title-w, 800); font-size: var(--title-size, 31px); line-height: 1.12; margin: 3px 0 0; letter-spacing: var(--title-ls, -.01em); text-shadow: 0 1px 2px rgba(0,0,0,.12); }
/* 제목 글씨 시안 고르기 */
.tfgrid { display: flex; flex-direction: column; gap: 10px; }
.tfopt { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 0; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; text-align: left; overflow: hidden; min-width: 0; }
.tfopt .smp { width: 100%; padding: 10px 14px 11px; color: #fff; background: linear-gradient(120deg, var(--g1), var(--g2) 58%, var(--g3)); }
.tfopt .smp small { display: block; font-size: 12px; font-weight: 700; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tfopt .smp span { display: block; font-family: var(--title-font); font-weight: var(--title-w); font-size: var(--title-size); letter-spacing: var(--title-ls); line-height: 1.12; margin-top: 2px; }
.tfopt b { font-size: 15px; padding: 6px 12px 0; }
.tfopt .muted { font-size: 13px; padding: 0 12px 10px; line-height: 1.35; }
.tfopt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.tfopt[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 800; color: var(--g1); background: #fff; }
.ttl { position: relative; }
.top h1.ghost { position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap; }
.clock { text-align: right; font-size: 12px; color: rgba(255,255,255,.92); line-height: 1.35; font-variant-numeric: tabular-nums; background: rgba(0,0,0,.16); border-radius: 12px; padding: 6px 10px; flex: none; }
.clock b { font-size: 16px; color: #fff; font-weight: 800; font-variant-numeric: tabular-nums; }

/* 공통 */
.stack { display: flex; flex-direction: column; gap: 14px; padding-top: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
.h2 { font-size: 20px; font-weight: 700; margin: 0; }
.muted { color: var(--muted); }
.pre { white-space: pre-line; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.todo { background: var(--todo-soft); color: var(--todo); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 16px; text-decoration: none; color: var(--ink); cursor: pointer; text-align: center; line-height: 1.25; }
.btn.primary { background: var(--btn2); background: linear-gradient(135deg, var(--btn1), var(--btn2)); color: #fff; border-color: transparent; }
.btn.uber { background: var(--uber); color: var(--uber-ink); border-color: var(--uber); }
.btn.sm { min-height: 40px; padding: 6px 12px; font-size: 15px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { flex: 1 1 140px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sec-title { font-size: 16px; font-weight: 700; color: var(--ink); margin: 12px 2px -2px; display: flex; align-items: center; gap: 8px; }
.sec-title::before { content: ""; flex: none; width: 4px; height: 17px; border-radius: 4px; background: linear-gradient(var(--g1), var(--g3)); }
/* 쇼핑: 도시별 머리띠 */
.cityhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; padding: 12px 14px; border-radius: 14px; color: #fff;
  background: var(--city); background: linear-gradient(120deg, color-mix(in oklab, var(--city) 85%, black), var(--city) 45%, color-mix(in oklab, var(--city) 75%, white)); }
.cityhead b { font-family: var(--display); font-weight: var(--display-w, 800); font-size: 22px; line-height: 1.2; }
.cityhead span { font-size: 14px; font-weight: 700; background: rgba(255,255,255,.24); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.shoplist { display: flex; flex-direction: column; gap: 12px; border-left: 4px solid var(--city); padding-left: 12px; margin-left: 2px; }
/* 홈 화면 아이콘 시안 미리보기 */
.icopts { display: flex; flex-direction: column; gap: 12px; }
.icopt { display: grid; grid-template-columns: 108px 1fr; gap: 14px; align-items: center; }
.icopt .wall { border-radius: 16px; padding: 14px 6px 9px; display: flex; flex-direction: column; align-items: center; gap: 5px;
  background: radial-gradient(120% 90% at 0% 0%, #F5A3C7, transparent 60%), radial-gradient(120% 90% at 100% 100%, #79B4FF, transparent 60%), linear-gradient(160deg, #8B79EE, #33479F); }
.icopt .wall img { width: 62px; height: 62px; border-radius: 22.5%; box-shadow: 0 4px 12px -4px rgba(0,0,0,.45); }
.icopt .wall small { max-width: 92px; color: #fff; font-size: 11px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
.icopt b { font-size: 17px; }
.icopt .muted { font-size: 14px; line-height: 1.4; margin-top: 2px; }
.note { font-size: 14px; color: var(--muted); }

/* 오늘 */
.hero { border-radius: 22px; padding: 20px 18px; color: #fff; position: relative; overflow: hidden; isolation: isolate; background: var(--city, #2F5FB3);
  background: radial-gradient(90% 120% at 100% 0%, rgba(255,255,255,.26), transparent 60%), linear-gradient(135deg, color-mix(in oklab, var(--city, #2F5FB3) 80%, white), var(--city, #2F5FB3) 50%, color-mix(in oklab, var(--city, #2F5FB3) var(--hero-shade), black));
  box-shadow: 0 12px 26px -16px var(--city, #2F5FB3); }
.hero::after { content: ""; position: absolute; right: -46px; bottom: -70px; width: 200px; height: 200px; border-radius: 50%; border: 24px solid rgba(255,255,255,.10); pointer-events: none; z-index: -1; }
.hero .dday { font-size: 14px; font-weight: 700; letter-spacing: .02em; opacity: .92; }
.hero .date { font-family: var(--title-font, var(--display)); font-weight: var(--title-w, 800); font-size: 34px; line-height: 1.15; margin: 4px 0 2px; }
.hero .wx { margin-top: 10px; display: inline-flex; gap: 6px; align-items: center; font-size: 15px; font-weight: 700; background: rgba(255,255,255,.18); border-radius: 999px; padding: 5px 12px 5px 9px; }
.wxe { font-size: 17px; line-height: 1; }
.dayhead .wx { margin-top: 4px; display: flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 600; color: var(--muted); }
.offl { margin-left: 8px; font-size: 11px; font-weight: 800; background: rgba(0,0,0,.3); padding: 2px 8px; border-radius: 999px; vertical-align: 1px; }
.fxrow { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 6px 14px; }
.fxrow .cur { font-size: 22px; font-weight: 800; color: var(--accent); width: 22px; text-align: center; }
.fxrow input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 26px; font-weight: 800; padding: 6px 0; font-variant-numeric: tabular-nums; outline: none; }
.fxrow .unit { font-size: 15px; color: var(--muted); font-weight: 700; }
.fxeq { text-align: center; color: var(--muted); font-weight: 800; margin: -6px 0; }
.fxquick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.fxquick .btn { padding-inline: 6px; }
.hero .flow { font-size: 18px; white-space: pre-line; opacity: .95; }
.next { display: flex; flex-direction: column; gap: 2px; }
.next .tline { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.next .t { font-size: 24px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.next .ti { font-size: 21px; font-weight: 700; line-height: 1.3; margin-top: 2px; }
.next .no { color: var(--muted); font-size: 16px; line-height: 1.45; margin-top: 4px; }
.next .no div + div { margin-top: 2px; }
.next .in { flex: none; font-size: 15px; font-weight: 800; color: var(--accent); }
.mini { display: flex; flex-direction: column; }
.mini button { display: grid; grid-template-columns: 92px 1fr; gap: 10px; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 0; cursor: pointer; align-items: baseline; }
.mini button:first-child { border-top: 0; }
.mini .t { font-size: 15px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.mini .ti { font-size: 17px; font-weight: 500; }
.mini .past { opacity: .45; }
/* 선 아이콘 (하단 바와 같은 느낌) */
.ico { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.kind { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; padding: 4px 10px 4px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.kind .ico { width: 16px; height: 16px; }
.evi { flex: none; width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; background: var(--cat); }
.evi .ico { width: 15px; height: 15px; stroke-width: 2.1; }
.evi.sm { width: 22px; height: 22px; }
.evi.sm .ico { width: 13px; height: 13px; }
.mini .ti { display: flex; align-items: center; gap: 8px; }
.mini .t.tk { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); }
.mini .t.tk .ico { width: 17px; height: 17px; }
/* 더보기: 아이폰 설정 화면처럼 색 아이콘 칸 */
.mrow { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mi { flex: none; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: #fff; background: var(--mc); }
.mi .ico { width: 18px; height: 18px; stroke-width: 2.1; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; background: var(--cat); flex: none; }

/* 지도 (직접 그리는 동선 지도) */
:root {
  --m-sea: #BFD5E5; --m-land: #F2F3F1; --m-park: #D8EAD6; --m-river: #A9C7DD; --m-road: #FFFFFF; --m-case: #D3D9DF;
  --m-route: #D2334A; --m-back: #0E8A7E; --m-rail: #1F4E8C; --m-label: #16202C; --m-halo: rgba(255,255,255,.94); --m-coast: #B9D3E4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --m-sea: #0B1620; --m-land: #151C24; --m-park: #1A2A21; --m-river: #23425A; --m-road: #2A3541; --m-case: #1B232C;
    --m-route: #F06476; --m-back: #4CC9B8; --m-rail: #8DB6EE; --m-label: #E9EEF4; --m-halo: rgba(13,18,24,.92); --m-coast: #23425A;
  }
}
:root[data-theme="dark"] {
  --m-sea: #0B1620; --m-land: #151C24; --m-park: #1A2A21; --m-river: #23425A; --m-road: #2A3541; --m-case: #1B232C;
  --m-route: #F06476; --m-back: #4CC9B8; --m-rail: #8DB6EE; --m-label: #E9EEF4; --m-halo: rgba(13,18,24,.92); --m-coast: #23425A;
}
.mapcard { padding: 0; overflow: hidden; }
.mapcard .cap { padding: 12px 16px 10px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.mapcard .cap b { font-size: 18px; }
.tmap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 5 / 4; background: var(--m-land); overflow: hidden; touch-action: pan-y;   /* 평소: 한 손가락은 페이지 스크롤 */ }
.tmap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; -webkit-transform: translateZ(0); transform: translateZ(0); }   /* 아이폰: 캔버스가 화면에 안 그려지는 문제 피하기 */
.tmap .chip { position: absolute; left: 10px; top: 10px; right: 64px; pointer-events: none; }
.tmap .chip span { display: inline-block; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; font-size: 15px; font-weight: 700; box-shadow: var(--shadow); line-height: 1.35; }
.tmap .zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.tmap .zoom button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; font-weight: 700; cursor: pointer; line-height: 1; }
.tmap .play { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); min-height: 46px; padding: 8px 18px; border-radius: 999px; border: 0; background: var(--m-route); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.18); white-space: nowrap; }
.tmap.live { touch-action: none; }   /* 지도를 한 번 톡 → 켜짐: 한 손가락이 지도 이동 */
.tmap.live::after { content: ""; position: absolute; inset: 0; border: 3px solid var(--accent); pointer-events: none; }
.tmap .maphint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(10, 15, 26, .72); color: #fff; font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 12px; pointer-events: none; white-space: nowrap; z-index: 2; }
.tmap .allbtn { position: absolute; right: 10px; top: 102px; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 12px; font-weight: 800; cursor: pointer; padding: 0; }
.mapfoot { font-size: 11px; color: var(--muted); padding: 6px 16px 10px; }
.stops { display: flex; flex-direction: column; }
.stopitem { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); align-items: center; }
.stopitem .sacts { display: flex; gap: 8px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.iconbtn:active { opacity: .7; }
.iconbtn .ico { width: 19px; height: 19px; stroke-width: 2; }
.stopitem .no { width: 26px; height: 26px; border-radius: 50%; background: var(--m-route); color: #fff; font-weight: 700; font-size: 14px; display: grid; place-items: center; margin-top: 2px; border: 0; cursor: pointer; }
.stopitem .nm { font-size: 17px; font-weight: 700; }
.stopitem .sub { font-size: 15px; color: var(--muted); }
.stopitem .btns { margin-top: 6px; }
.stopitem .btns .btn { flex: 0 1 auto; }
.legline { padding: 2px 16px 2px 56px; font-size: 14px; color: var(--muted); }
.legline b { color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 16px 0; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; }
.lc { display: inline-block; width: 22px; height: 0; border-top: 4px solid var(--m-route); border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.lc.back { border-top-color: var(--m-back); }
.lc.rail { border-top: 4px dashed var(--m-rail); }
.lc.foot { border-top: 4px dotted var(--muted); }
.legline { display: flex; align-items: center; flex-wrap: wrap; }

/* 일정 */
.days { display: flex; gap: 8px; overflow-x: auto; padding: 14px 2px 6px; margin-inline: -16px; padding-inline: 16px; scroll-snap-type: x proximity; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.daychip { flex: none; scroll-snap-align: start; min-width: 74px; text-align: center; border: 2px solid var(--line); background: var(--surface); border-radius: 14px; padding: 7px 8px; cursor: pointer; }
.daychip b { display: block; font-size: 17px; }
.daychip span { font-size: 12px; color: var(--muted); }
.daychip i { display: block; height: 4px; border-radius: 4px; margin-top: 6px; background: var(--city); }
.daychip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.dayhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.dayhead .date { font-family: var(--title-font, var(--display)); font-weight: var(--title-w, 800); font-size: 28px; line-height: 1.15; }
.tl { display: flex; flex-direction: column; }
.ev { position: relative; display: grid; grid-template-columns: 30px 1fr; gap: 12px; padding: 12px 0 14px; }
.ev .rail { position: relative; display: flex; justify-content: center; padding-top: 2px; }
.ev .rail .evi { position: relative; z-index: 1; width: 30px; height: 30px; }
.ev .rail .evi .ico { width: 16px; height: 16px; }
.ev:not(:last-child) .rail::after { content: ""; position: absolute; top: 36px; bottom: -16px; left: 50%; width: 2px; margin-left: -1px; background: var(--line); border-radius: 2px; }
.ev .body { min-width: 0; }
.ev .tline { display: flex; align-items: center; gap: 8px; min-height: 22px; }
.ev .t { font-size: 15px; font-weight: 800; line-height: 1.3; color: var(--cat); font-variant-numeric: tabular-nums; }
.ev .ti { font-size: 19px; font-weight: 700; line-height: 1.3; margin-top: 2px; }
.ev .no { color: var(--muted); font-size: 16px; margin-top: 4px; line-height: 1.45; }
.ev .no div + div { margin-top: 2px; }
.ev .pl { font-size: 15px; color: var(--muted); margin-top: 3px; }
.ev .tk { margin-top: 6px; }
.ev .go { margin-top: 10px; min-height: 42px; font-size: 15px; }
.nowcard { padding: 12px 14px; }
.nowline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 17px; }
.nowline .muted { font-size: 14px; }
.mini button.nowrow { background: var(--accent-soft); border-radius: 10px; margin-inline: -8px; padding-inline: 8px; border-top-color: transparent; }
.mini button.nowrow .ti { font-weight: 800; }
.ev.now { margin-inline: -8px; padding-inline: 8px; border-radius: 12px; background: var(--accent-soft); box-shadow: inset 4px 0 0 var(--accent); }
.nowpill { flex: none; font-size: 12px; font-weight: 800; color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 8px; }
.ev[data-route] { cursor: pointer; margin-inline: -8px; padding-inline: 8px; border-radius: 12px; -webkit-tap-highlight-color: transparent; transition: background-color .2s; }
.ev[data-route]:active { background: var(--surface-2); }
.ev.on { background: var(--accent-soft); }
.ev .evmap { margin-left: auto; flex: none; font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; }
.ev.on .evmap { background: var(--surface); }

/* 티켓 */
.wcard { display: flex; flex-direction: column; gap: 6px; }
.wcard .head { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.wcard .ti { font-size: 19px; font-weight: 700; line-height: 1.3; }
.code { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 8px 8px 8px 12px; margin-top: 4px; }

/* 식당 */

.goicon svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; }
.rowlink { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; color: inherit; text-decoration: none; box-shadow: var(--shadow); -webkit-tap-highlight-color: transparent; transition: background-color .15s, transform .15s; }

/* 하단 바: 선택 표시 하나가 탭 사이를 미끄러져 이동 + 아이콘이 살짝 통통 */
.tabs .ind { position: absolute; left: 0; top: 0; height: 100%; width: 0; border-radius: 12px; background: var(--btn2); background: linear-gradient(135deg, var(--btn1), var(--btn2)); box-shadow: 0 6px 14px -8px var(--btn1); transition: transform .42s cubic-bezier(.34, 1.3, .5, 1), width .3s ease; pointer-events: none; }
.tabs .ind.noanim { transition: none; }

.tabs button[aria-current="page"] { color: #fff; }

@media (prefers-reduced-motion: reduce) { .tabs .ind { transition: none; } .tabs button[aria-current="page"] svg { animation: none; } }

/* 겹쳐 뜨는 화면 */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; gap: 12px; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }

/* 탭 전환: 내용은 바로 바꿈 (투명하게 시작하면 오늘 화면의 진한 카드가 사라질 때 깜빡여 보임) · 부드러움은 하단 바 표시가 맡음 */

<script>
(() => {
  const D = JSON.parse(document.getElementById("data").textContent);
  const $ = s => document.querySelector(s);
  // 칩 줄만 가로로 움직이기 (scrollIntoView는 아이폰에서 화면 전체를 밀어 아래 탭바가 떠 보이는 문제가 있음)
  function centerChip(el, smooth) {
    if (!el) return; const box = el.parentElement, r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
    const left = box.scrollLeft + (r.left + r.width / 2) - (b.left + b.width / 2);
    if (smooth && !REDUCE && box.scrollTo) box.scrollTo({ left, behavior: "smooth" }); else box.scrollLeft = left;
  }
  // 날짜 · 끼니 바꾸기: 칩 줄은 그대로 두고 아래 내용만 바꿈. 다음 날은 오른쪽에서, 이전 날은 왼쪽에서 살짝 밀려 들어옴
  const lastKey = {};
  function paint(root, row, pane, key) {
    const oldRow = root.querySelector(":scope > .days"), oldPane = root.querySelector(":scope > .stack");
    const prev = lastKey[root.id]; lastKey[root.id] = key;
    if (!oldRow || !oldPane || prev === undefined || prev === key) {
      root.innerHTML = row + pane; centerChip(root.querySelector(".daychip[aria-pressed='true']"), false); return;
    }
    const t = document.createElement("div"); t.innerHTML = row + pane;
    const newRow = t.firstElementChild, newPane = t.lastElementChild;
    if (newRow.children.length === oldRow.children.length) [...newRow.children].forEach((n, i) => {   // 같은 칩의 속성만 바꿔서 선택 표시가 부드럽게 옮겨감
      const o = oldRow.children[i];
      [...n.attributes].forEach(a => { if (o.getAttribute(a.name) !== a.value) o.setAttribute(a.name, a.value); });
      if (o.innerHTML !== n.innerHTML) o.innerHTML = n.innerHTML;
    }); else oldRow.replaceWith(newRow);
    oldPane.replaceWith(newPane);
    if (!REDUCE && newPane.animate) newPane.animate([{ opacity: 0, transform: `translateX(${key > prev ? 28 : -28}px)` }, { opacity: 1, transform: "none" }], { duration: 260, easing: "cubic-bezier(.2, .8, .2, 1)" });
    centerChip(root.querySelector(".daychip[aria-pressed='true']"), true);
  }
  // 세로로 어떤 요소를 위 머리띠와 아래 탭바 사이 가운데로
  function reveal(el, smooth) {
    const sc = el.closest(".view"); if (!sc) return;
    const r = el.getBoundingClientRect(), t = ($(".top") || { getBoundingClientRect: () => ({ bottom: 0 }) }).getBoundingClientRect().bottom;
    const tb = $(".tabs"), bt = tb ? tb.getBoundingClientRect().top : innerHeight, gap = bt - t;
    const y = sc.scrollTop + r.top - (r.height < gap ? t + (gap - r.height) / 2 : t + 8);
    sc.scrollTo({ top: Math.max(0, y), behavior: smooth ? "smooth" : "auto" });
  }
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem("es26:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("es26:" + k, JSON.stringify(v)); } catch (e) {} }
  };
  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const CAT = { "이동": "var(--c-move)", "관광": "var(--c-see)", "식사": "var(--c-eat)", "경기": "var(--c-match)", "숙소": "var(--c-stay)", "자유": "var(--c-free)" };
  const TITLES = { today: "오늘", plan: "일정", wallet: "티켓 · 예약", food: "식당 고르기", more: "더보기" };
  const CITY_EN = { "마드리드": "Madrid", "그라나다": "Granada", "마요르카": "Mallorca", "바르셀로나": "Barcelona" };
  const mealByKey = Object.fromEntries(D.meals.map(m => [m.key, m]));
  const cityOf = d => D.daycity[d - 1];
  const colorOf = d => D.cityColor[cityOf(d)] || "#2F5FB3";
  const stayOf = d => D.stays.find(s => s.days.includes(d));
  const evsOf = d => D.events.filter(e => e.day === d).sort((a, b) => a.start - b.start);
  const mins = e => { const m = String(e.time).match(/(\d{1,2}):(\d{2})/); return m ? (+m[1]) * 60 + (+m[2]) : e.start * 60; };

  // 현지인에게 하는 말: 영어가 기본 (스페인어로 말하면 스페인어로 대답이 와서), 🇪🇸 버튼을 누르면 스페인어도
  function sayBox(en, es, ko, opt = {}) {
    return `<div class="say2${opt.big ? " big2" : ""}"><div class="en">${esc(en)}</div>
      <div class="es2" hidden><span>${esc(es)}</span>${opt.copy ? `<button class="btn sm" data-copy="${esc(es)}">스페인어 복사</button>` : ""}</div>
      ${ko ? `<div class="ko2">${esc(ko)}</div>` : ""}
      <div class="act"><button class="btn sm" data-lang="1" aria-pressed="false">🇪🇸 스페인어</button>${opt.copy ? `<button class="btn sm" data-copy="${esc(en)}">영어 복사</button>` : ""}</div></div>`;
  }

  /* ---------- 선 아이콘 ---------- */
  const IC = {
    plane: '<path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" fill="currentColor" stroke="none"/>',
    train: '<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8.5 21l2-4M15.5 21l-2-4"/><path d="M8.5 14h.01M15.5 14h.01" stroke-width="2.6"/>',
    bed: '<path d="M3 19V8M3 15h18v4M21 15v-2.5A2.5 2.5 0 0 0 18.5 10H11v5"/><circle cx="7" cy="12.2" r="1.8"/>',
    ticket: '<path d="M4 7.5h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/><path d="M14 7.5v10" stroke-dasharray="1.6 2"/>',

    canvas.addEventListener("wheel", e => { if (playing) return; e.preventDefault(); stopGlide(); cam = { ...cam, z: Math.min(17, Math.max(4, cam.z - e.deltaY / 400)) }; paint(); }, { passive: false });
    const ro = new ResizeObserver(() => { const had = !!W; size(); if (!had) { cam = restCam(); restChip(); } draw(); });
    ro.observe(host);
    // 아이폰은 앱이 뒤로 갔다 오거나 메모리가 부족하면 캔버스 그림을 비워버림 → 다시 보일 때마다 새로 그리기
    function redraw() { if (!alive) return; const r = host.getBoundingClientRect(); if (!r.width || !r.height) return; C = mapColors(); size(); if (!cam || !isFinite(cam.x) || !isFinite(cam.y) || !isFinite(cam.z)) cam = restCam(); draw(); }
    // 비어 있으면 다시 그리고, 그래도 비면 진단 숫자를 안내 칸에 (화면 캡처로 원인 확인)
    const isBlank = () => { try { if (!canvas.width || !canvas.height) return true; return ctx.getImageData(canvas.width >> 1, canvas.height >> 1, 1, 1).data[3] === 0; } catch (e) { return false; } };
    let blanks = 0;
    function heal() {
      if (!alive || playing) return;
      const r = host.getBoundingClientRect(); if (!r.width || !r.height) return;
      redraw();
      if (isBlank()) { if (++blanks >= 2) chip.textContent = `지도 진단 · ${Math.round(r.width)}×${Math.round(r.height)} · ${canvas.width}×${canvas.height} · z ${cam ? Number(cam.z).toFixed(1) : "-"} · ${document.visibilityState}${lastErr ? " · " + lastErr.slice(0, 60) : ""}`; if (blanks < 6) setTimeout(heal, 700); }
      else blanks = 0;
    }
    const io = new IntersectionObserver(es => es.forEach(en => {
      if (!en.isIntersecting) { setLive(false); return; }
      if (!playing) heal();
      if (en.intersectionRatio > .55 && !played && !REDUCE && ensure()) play();
    }), { threshold: [0, .6] });
    const onShow = () => { if (document.visibilityState === "visible") setTimeout(heal, 60); };
    [250, 900, 2000].forEach(ms => setTimeout(heal, ms));   // 처음 띄운 직후 화면 크기가 자리 잡을 때까지 몇 번 더
    document.addEventListener("visibilitychange", onShow); window.addEventListener("pageshow", onShow);
    canvas.addEventListener("contextrestored", redraw);
    io.observe(host);
    const mq = matchMedia("(prefers-color-scheme: dark)"), onTheme = () => { C = mapColors(); draw(); };
    mq.addEventListener("change", onTheme);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => draw());
    return { fly, route, destroy() {
      alive = false; cancel(); stopGlide(); cancelAnimationFrame(frame); clearTimeout(liveTimer); clearTimeout(hintTimer); ro.disconnect();
      document.removeEventListener("touchstart", offIfOutside, { capture: true }); if (view) view.removeEventListener("scroll", onViewScroll); io.disconnect(); mq.removeEventListener("change", onTheme);
      document.removeEventListener("visibilitychange", onShow); window.removeEventListener("pageshow", onShow);
      canvas.width = canvas.height = 0;   // 캔버스 메모리 바로 돌려주기 (아이폰은 한도를 넘으면 새 지도가 하얗게 나옴)
    } };
  }

  function dayMaps(d, withList) {
    const S = SC.days[String(d)];
    if (!S) return d === 10 ? `<div class="card"><div class="h2">인천 도착</div><p class="muted">수고 많으셨어요. 집까지 조심히 오세요.</p></div>` : "";
    const city = cityOf(d) === "귀국" ? "바르셀로나" : cityOf(d);
    let list = "";
    if (withList) {
      const legs = S.legs;
      list = `<div class="stops">${S.seq.map((si, i) => {
        const s = S.stops[si], L = legs[i] && !S.stops[S.seq[i + 1]].off ? legs[i] : null;
        if (s.off) return "";
        const lg = L ? { ...L, a: S.stops[si], b: S.stops[S.seq[i + 1]], km: L.m ? L.m / 1000 : hav(S.stops[si].ll, S.stops[S.seq[i + 1]].ll) } : null;
        const back = L && S.seq.slice(0, i + 1).includes(S.seq[i + 1]);
        const lc = L ? (L.mode === "train" || L.mode === "flight" ? "rail" : back ? "back" : "go") : "";
        const again = S.seq.indexOf(si) < i;
        const no = S.stops.slice(0, si + 1).filter(x => !x.off).length;
        return `<div class="stopitem"><button class="no" data-fly="${d}:${si}:${i}" aria-label="${no}번 지도에서 보기">${no}</button><div><div class="nm">${esc(s.name)}${again ? ' <span class="muted" style="font-weight:500">(다시)</span>' : ""}</div>
          ${s.sub && !again ? `<div class="sub">${ap(s.sub)}</div>` : ""}
          </div>${s.off ? "" : `<div class="sacts"><a class="iconbtn" href="${mapQ(s.q || s.name)}" target="_blank" rel="noopener" aria-label="${esc(s.name)} 구글 지도">${ico("pin")}</a><button class="iconbtn" data-ride="stop:${d}:${si}" aria-label="${esc(s.name)} 택시 · 우버">${ico("car")}</button></div>`}</div>
          ${lg ? `<div class="legline"><i class="lc ${lc}"></i><b>${esc(legText(lg))}</b>${back ? " · 돌아가는 길" : ""}</div>` : ""}`;
      }).join("")}</div>`;
    }
    return `<div class="card mapcard"><div class="cap"><b>${esc(city)} 동선</b><span class="muted">${S.pins ? "★ 추천 저녁 식당" : ""}</span></div>
      <div class="tmap" data-day="${d}"><canvas aria-label="${esc(city)} 동선 지도" role="img"></canvas>
        <div class="chip"><span>동선</span></div>
        <div class="zoom"><button data-z="1" aria-label="확대">+</button><button data-z="-1" aria-label="축소">−</button></div>
        <button class="allbtn" hidden aria-label="전체 동선 보기">전체</button>
        <div class="maphint" hidden></div>
        <button class="play">▶ 동선 따라가기</button></div>
      <div class="legend"><span><i class="lc go"></i>가는 길</span><span><i class="lc back"></i>돌아가는 길</span><span><i class="lc rail"></i>기차 · 비행기</span><span><i class="lc foot"></i>걷기 (점선)</span></div>
      <div class="mapfoot">지도 데이터 © OpenStreetMap contributors · 이동 시간은 길이 막히지 않을 때 기준${S.note ? " · " + esc(S.note) : ""}</div>${list}</div>`;
  }
  function mountMaps(root) {
    root.querySelectorAll(".tmap[data-day]").forEach(h => {
      try { MAPS[h.dataset.day + ":" + root.id] = TripMap(h, +h.dataset.day); }
      catch (e) { const c = h.querySelector(".chip span"); if (c) c.textContent = "지도 오류 · " + String((e && e.message) || e).slice(0, 90); }
    });
  }

  /* ---------- 오늘 ---------- */
  function renderToday() {
    const { idx, now } = tripDay();
    const before = idx < 1, after = idx > 10;
    const d = before ? 1 : after ? 10 : idx;
    const evs = evsOf(d);
    const live = !before && !after;
    const next = live ? (evs.find(e => mins(e) >= now) || null) : evs[0];
    const cur = live ? [...evs].reverse().find(e => mins(e) <= now) || null : null;   // 지금 하고 있는 일정
    const left = next && live ? mins(next) - now : null;
    const leftTxt = left == null ? "" : left < 60 ? `${left}분 뒤` : `${Math.floor(left / 60)}시간 ${left % 60}분 뒤`;
    const label = before ? `출발까지 D-${1 - idx} · 첫날 미리보기` : after ? "여행이 끝났어요 · 마지막 날" : `Day ${d} / 10`;
    const stay = stayOf(d);
    const tickets = D.wallet.filter(w => w.day === d);
    $("#v-today").innerHTML = `<div class="stack">
      <div class="hero" style="--city:${colorOf(d)}">
        <div class="dday">${esc(label)}</div>
        <div class="date">${esc(D.dates[d - 1])}</div>
        <div class="flow">${esc(D.flow[d - 1])}</div>
        <div class="wx" data-wx="${d}" hidden></div>
      </div>
      ${cur ? `<div class="card nowcard"><div class="nowline"><span class="nowpill">지금</span><span class="evi sm" style="--cat:${CAT[cur.cat]}">${ico(evIco(cur))}</span><b>${esc(cur.title)}</b><span class="muted">${ap(String(cur.time).split("\n")[0])}</span></div></div>` : ""}
      ${next ? `<div class="card"><p class="eyebrow">${live ? "다음 일정" : "첫 일정"}</p>
        <div class="next"><div class="tline"><span class="t" style="color:${CAT[next.cat]}">${ap(String(next.time).split("\n")[0])}</span>${leftTxt ? `<span class="in">${leftTxt}</span>` : ""}</div>
        <div class="ti">${esc(next.title)}</div>${next.note ? `<div class="no">${String(next.note).split("\n").filter(x => x.trim()).map(x => `<div>${ap(x)}</div>`).join("")}</div>` : ""}</div></div>` : (live ? `<div class="card"><p class="eyebrow">다음 일정</p><div class="h2">오늘 남은 일정이 없어요</div></div>` : "")}
      ${stay ? `<div class="card"><p class="eyebrow">오늘 숙소</p><div class="h2">${esc(stay.name)}</div>
        <div class="muted">${esc(stay.area)}</div><div class="addr" style="margin-top:6px">${esc(stay.addr)}</div>
        <div class="grid2" style="margin-top:12px"><a class="btn" href="${mapQ(stay.name + ", " + stay.addr)}" target="_blank" rel="noopener">지도</a>
        <button class="btn primary" data-ride="stay:${d}">택시 · 우버</button></div></div>` : ""}
      ${taxiCards(D.taxiplan.filter(t => t.remind === d), "오늘 할 일 · 택시 미리 부탁하기")}
      ${tickets.length ? `<div class="card"><p class="eyebrow">오늘 챙길 티켓 · 예약</p><div class="mini">${tickets.map(w =>
        `<button data-wday="${d}"><span class="t tk">${ico(kindIco(w.kind))}${esc(w.kind)}</span><span class="ti"><span>${esc(w.title)}${w.who ? ` · <b>${esc(w.who)}</b>` : ""}</span></span></button>`).join("")}</div></div>` : ""}
      <div class="card"><p class="eyebrow">${live ? "오늘" : esc(D.dates[d - 1])} 전체 일정</p><div class="mini">${evs.map(e =>
        `<button data-plan="${d}" class="${e === cur ? "nowrow" : live && mins(e) < now && e !== next ? "past" : ""}"><span class="t">${ap(String(e.time).split("\n")[0])}</span><span class="ti"><span class="evi sm" style="--cat:${CAT[e.cat]}">${ico(evIco(e))}</span>${esc(e.title)}</span></button>`).join("")}</div>
        <div class="btns" style="margin-top:8px"><button class="btn" data-plan="${d}">자세히 보기</button></div></div>
      ${dayMaps(d, false)}
    </div>`;
    mountMaps($("#v-today")); fillWx($("#v-today"));
  }

  /* ---------- 일정 ---------- */
  let planDay = null;   // 앱을 새로 켜면 그날 날짜부터
  function renderPlan() {
    const { idx, now } = tripDay();
    if (!planDay) planDay = idx >= 1 && idx <= 10 ? idx : 1;
    const d = planDay, stay = stayOf(d);
    const nowEv = d === idx ? [...evsOf(d)].reverse().find(e => mins(e) <= now) || null : null;   // 오늘이면 지금 하고 있는 일정
    const chips = D.dates.map((dt, i) => {
      const n = i + 1, [md, wd] = dt.split(" ");
      return `<button class="daychip" style="--city:${colorOf(n)}" aria-pressed="${n === d}" data-day="${n}"><b>${md}</b><span>${wd.replace(/[()]/g, "")} · ${esc(cityOf(n))}</span><i></i></button>`;
    }).join("");
    const evs = evsOf(d).map(e => {
      const m = e.food && mealByKey[e.food];
      const cnt = m ? m.places.length : 0;
      const rt = e.route ? ` data-route="${d}:${e.route[0]}:${e.route[1]}" role="button" tabindex="0" aria-label="${esc(e.title)} 경로를 지도에서 보기"` : "";
      const isNow = e === nowEv;
      const tm = String(e.time).split("\n").map(x => x.trim()).filter(Boolean).join(" ").replace(/\s*~\s*/g, " ~ ").trim();
      return `<div class="ev${isNow ? " now" : ""}" style="--cat:${CAT[e.cat]}"${rt}><div class="rail"><span class="evi">${ico(evIco(e))}</span></div><div class="body">
        <div class="tline"><span class="t">${ap(tm)}</span>${isNow ? `<span class="nowpill">지금</span>` : ""}${e.route ? `<span class="evmap">${e.route[0] === e.route[1] ? "위치" : "경로"} ↓</span>` : ""}</div>
        <div class="ti">${esc(e.title)}</div>
        ${e.note ? `<div class="no">${String(e.note).split("\n").filter(x => x.trim()).map(x => `<div>${ap(x)}</div>`).join("")}</div>` : ""}
        ${e.place ? `<div class="pl">${esc(e.place)}</div>` : ""}
        ${e.ticket ? `<div class="tk"><span class="pill">${esc(e.ticket)}</span></div>` : ""}
        ${m ? `<button class="btn go" data-meal="${m.key}">${cnt ? `식당 후보 ${cnt}곳 보기` : "식당 찾아보기"}</button>` : ""}
      </div></div>`;
    }).join("");
    paint($("#v-plan"), `<div class="days" role="group" aria-label="날짜">${chips}</div>`, `
      <div class="stack" style="padding-top:8px">
        <div class="dayhead"><div><div class="date">${esc(D.dates[d - 1])}</div><div class="muted pre">${esc(D.flow[d - 1])}</div><div class="wx sm" data-wx="${d}" hidden></div></div>
        <span class="pill" style="background:${colorOf(d)};color:#fff">Day ${d}</span></div>
        <div class="card"><p class="eyebrow">시간표</p><div class="tl">${evs || `<div class="muted">일정이 없어요</div>`}</div></div>
        ${stay ? `<div class="card"><p class="eyebrow">이날 숙소</p><div class="h2">${esc(stay.name)}</div><div class="addr muted">${esc(stay.addr)}</div>
        <div class="grid2" style="margin-top:10px"><a class="btn" href="${mapQ(stay.name + ", " + stay.addr)}" target="_blank" rel="noopener">지도</a><button class="btn primary" data-ride="stay:${d}">택시 · 우버</button></div></div>` : ""}
        ${dayMaps(d, true)}
      </div>`, d);
    mountMaps($("#v-plan")); fillWx($("#v-plan"));
  }

  /* ---------- 티켓 ---------- */
  let walletDay = null;
  function renderWallet() {
    const days = [...new Set(D.wallet.map(w => w.day))].sort((a, b) => a - b);
    if (!days.includes(walletDay)) { const { idx } = tripDay(); walletDay = days.find(d => d >= idx) || days[0]; }
    const d = walletDay, list = D.wallet.filter(w => w.day === d);
    const chips = days.map(n => {
      const [md, wd] = D.dates[n - 1].split(" ");
      return `<button class="daychip" style="--city:${colorOf(n)}" aria-pressed="${n === d}" data-wday="${n}"><b>${md}</b><span>${wd.replace(/[()]/g, "")} · ${D.wallet.filter(w => w.day === n).length}개</span><i></i></button>`;
    }).join("");
    paint($("#v-wallet"), `<div class="days" role="group" aria-label="날짜">${chips}</div>`, `
      <div class="stack" style="padding-top:8px">
      <div class="dayhead"><div><div class="date">${esc(D.dates[d - 1])}</div><div class="muted">${esc(cityOf(d))} · 티켓 · 예약 ${list.length}개</div></div>
        <span class="pill" style="background:${colorOf(d)};color:#fff">Day ${d}</span></div>
      <p class="note">파란 버튼을 누르면 예약 앱이나 티켓 원본이 열려요. 아직 버튼이 없는 티켓은 링크를 알려주면 연결할게요.</p>
      ${list.map(w => `<div class="card wcard">
        <div class="head"><span class="kind">${ico(kindIco(w.kind))}${esc(w.kind)}</span>${statusPill(w.status)}</div>
        <div class="ti">${esc(w.title)}</div><div class="muted">${ap(w.time)}</div>
        ${w.who ? `<div class="who">가지고 있는 사람 · <b>${esc(w.who)}</b></div>` : ""}
        ${w.code ? `<div class="code"><div><div class="lab">예약번호</div><div class="val">${esc(w.code)}</div></div><button class="btn" data-copy="${esc(w.code)}">복사</button></div>` : ""}
        ${(w.codes || []).map(([k, v]) => `<div class="code"><div><div class="lab">${esc(k)}</div><div class="val">${esc(v)}</div></div><button class="btn" data-copy="${esc(v)}">복사</button></div>`).join("")}
        ${w.memo ? `<div class="muted pre">${ap(w.memo)}</div>` : ""}
        ${(w.open || []).map(l => `<a class="btn primary" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}
        ${!(w.open || []).length && w.status !== "미예약" ? `<div class="nolink">티켓 원본 링크 없음 · 메일·앱 링크를 알려주면 버튼이 생겨요</div>` : ""}
        ${w.links ? `<div class="links">${w.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} →</a>`).join("")}</div>` : ""}
      </div>`).join("")}</div>`, d);
  }

  /* ---------- 식당 ---------- */
  let mealKey = null;
  // 끼니 → 날짜 · 점심/저녁 ("11/2 (월) 저녁 (19:30)" → 11/2, 저녁)
  const mealDate = m => String(m.meal).split(" ")[0];
  const mealSlot = m => /저녁/.test(m.meal) ? "dinner" : "lunch";
  const dayIdx = dt => D.dates.findIndex(x => x.startsWith(dt + " ")) + 1;
  const MEALDAYS = [...new Set(D.meals.map(mealDate))].sort((a, b) => dayIdx(a) - dayIdx(b));
  const gImg = q => "https://www.google.com/search?udm=2&q=" + encodeURIComponent(q);
  function renderFood() {
    if (!mealKey || !mealByKey[mealKey]) {   // 여행 중이면 그날 끼니 (오후 3시 전 점심 · 이후 저녁), 아니면 첫 후보
      const { idx, now } = tripDay(), td = idx >= 1 && idx <= 10 ? D.dates[idx - 1].split(" ")[0] : null;
      const ms = td ? D.meals.filter(x => mealDate(x) === td) : [];
      const pick = ms.find(x => mealSlot(x) === (now >= 15 * 60 ? "dinner" : "lunch")) || ms[0];
      mealKey = (pick || D.meals.find(m => mealDate(m) === MEALDAYS[0]) || D.meals[0]).key;   // 여행 전 · 후: 첫날(11/1)부터
    }
    const m = mealByKey[mealKey], city = CITY_EN[m.region] || "";
    const md = mealDate(m), slot = mealSlot(m), dayMeals = dt => D.meals.filter(x => mealDate(x) === dt);
    const chips = MEALDAYS.map(dt => {
      const ms = dayMeals(dt), di = dayIdx(dt), target = dt === md ? m : (ms.find(x => mealSlot(x) === "lunch") || ms[0]);   // 다른 날짜로 가면 그날 점심부터 (점심 없으면 첫 끼니)
      const [mdd, wd] = D.dates[di - 1].split(" ");
      return `<button class="daychip" style="--city:${colorOf(di)}" aria-pressed="${dt === md}" data-meal="${target.key}"><b>${mdd}</b><span>${wd.replace(/[()]/g, "")} · ${esc(cityOf(di))}</span><i></i></button>`;
    }).join("");
    const seg = ["lunch", "dinner"].map(sl => {
      const x = dayMeals(md).find(y => mealSlot(y) === sl), lab = sl === "lunch" ? "점심" : "저녁";
      if (!x) return `<button disabled><span>${lab}</span><small>일정 없음</small></button>`;
      const word = /식사/.test(x.meal) ? "식사" : lab;
      const sub = String(x.meal).split(" ").slice(2).join(" ").replace(/^(점심|저녁|식사)\s*/, "").replace(/^·\s*/, "").replace(/[()]/g, "").trim();
      return `<button data-meal="${x.key}" aria-pressed="${x.key === mealKey}"><span>${word}</span>${sub ? `<em>${ap(sub)}</em>` : ""}<small>${x.places.length ? x.places.length + "곳" : "후보 준비 중"}</small></button>`;
    }).join("");
    const cards = m.places.map((p, i) => {
      const [nm, ...ko] = String(p.name).split("\n");
      const star = String(p.rec || "").includes("⭐");
      const rank = String(p.rec || "").replace("⭐", "").trim();
      const [rate, cnt] = String(p.rating).split("\n");
      const walk = (String(p.where).match(/도보[^\n]*/) || [""])[0];
      const loc = String(p.where).split("\n").filter(l => !/도보/.test(l)).join("\n");
      return `<article class="card place">
        <div class="top2">${rank ? `<div class="rank ${star ? "star" : ""}"><div>${esc(rank)}<small>${star ? "추천" : "순위"}</small></div></div>` : ""}
          <div><a class="titlelink" href="https://www.google.com/search?q=${encodeURIComponent(nm + " " + city)}" target="_blank" rel="noopener" aria-label="${esc(nm)} 구글에서 검색">

  /* ---------- 실시간 영업시간 (구글 장소 API) ----------
     식당 탭에서 보고 있는 끼니의 식당만 받고 6시간 저장 (한 곳에 1KB 안팎 → 데이터 부담 거의 없음).
     "지금 영업 중"은 저장된 주간 시간표로 그때그때 계산 → 인터넷이 끊겨도 맞게 보임. */
  const PL_TTL = 6 * 3600e3, WD = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];
  const plCache = pid => store.get("pl:" + pid, null);
  async function plFetch(pid) {
    const q = new URLSearchParams({ fields: "currentOpeningHours,utcOffsetMinutes,internationalPhoneNumber,businessStatus", languageCode: "ko", key: D.placesKey });
    const r = await fetch(`https://places.googleapis.com/v1/places/${encodeURIComponent(pid)}?${q}`, { cache: "no-store" });
    if (!r.ok) throw new Error("places " + r.status);
    const d = await r.json(); store.set("pl:" + pid, { t: Date.now(), d }); return d;
  }
  function openState(oh, off) {
    const ps = (oh && oh.periods) || []; if (!ps.length) return null;
    const n = new Date(Date.now() + (off || 0) * 60000), W = 7 * 1440;
    const now = n.getUTCDay() * 1440 + n.getUTCHours() * 60 + n.getUTCMinutes(), at = x => x.day * 1440 + x.hour * 60 + (x.minute || 0);
    for (const p of ps) {
      if (!p.open) continue;
      if (!p.close) return { open: true };   // 24시간
      let o = at(p.open), c = at(p.close); if (c <= o) c += W;
      for (const k of [0, -W]) if (now >= o + k && now < c + k) return { open: true, close: c + k };
    }
    let next = Infinity; ps.forEach(p => { if (!p.open) return; let o = at(p.open); if (o <= now) o += W; next = Math.min(next, o); });
    return { open: false, next: isFinite(next) ? next : null, days: next - now > 1440 };

    const parts = [], oh = d.currentOpeningHours, md = mealDate(m), [mo, da] = md.split("/").map(Number), wd = WD[new Date(2026, mo - 1, da).getDay()];

    if (oh) {
      const line = (oh.weekdayDescriptions || []).find(x => x.startsWith(wd));
      if (line) { const h = line.slice(line.indexOf(":") + 1).trim().replace(/오전 12:(\d\d)/g, "밤 12:$1").replace(/오전 ([1-5]):(\d\d)/g, "새벽 $1:$2"); parts.push(/휴무/.test(h) ? `<span class="st off">${esc(md)} (${wd[0]}) 휴무</span>` : `<span>${esc(md)} (${wd[0]}) ${esc(h)}</span>`); }

      const s = openState(oh, d.utcOffsetMinutes);
      if (s) parts.push(s.open ? `<span class="st on">● 지금 영업 중${s.close != null ? " · " + clockOf(s.close) + " 마감" : ""}</span>`

    if (kind === "stay") { const s = stayOf(+a); return s && { name: s.name, addr: s.addr, ll: s.ll, city: cityOf(+a), gmap: mapQ(s.name + ", " + s.addr) }; }

    if (kind === "food") { const m = mealByKey[mealKey], p = m.places[+a]; const nm = String(p.name).split("\n")[0], addr = String(p.where).split("\n").find(l => /\(/.test(l)) || "";
      return { name: nm, addr, ll: p.ll, city: m.region, gmap: p.cid ? "https://maps.google.com/?cid=" + p.cid : mapQ(nm + ", " + m.region) }; }
  }
  function uberUrl(t) {
    const q = new URLSearchParams({ action: "setPickup", pickup: "my_location", "dropoff[latitude]": t.ll[0], "dropoff[longitude]": t.ll[1], "dropoff[nickname]": t.name });
    if (t.addr) q.set("dropoff[formatted_address]", t.addr);
    return "https://m.uber.com/ul/?" + q.toString();
  }
  let rideCur = null;
  function openRide(spec) {
    const t = rideTarget(spec); if (!t) return;
    rideCur = t;
    const city = t.city === "귀국" ? "바르셀로나" : t.city;
    const avail = D.rideCity[city] || "ok";
    $("#ride").innerHTML = `<div class="wrap"><button class="btn close" data-close="ride">닫기</button>
      <p class="eyebrow">어디로 갈까요</p><div class="dest">${esc(t.name)}</div>${t.addr ? `<div class="addr muted">${esc(t.addr)}</div>` : ""}
      <div class="opt">
        ${t.ll ? `<a class="btn uber" href="${uberUrl(t)}" target="_blank" rel="noopener">Uber로 부르기 (목적지 자동 입력)</a>` : ""}
        ${avail === "few" ? `<p class="note">그라나다는 우버 기사가 적어 오래 기다릴 수 있어요. 호텔이나 식당에 택시를 불러달라고 하는 게 빨라요.</p>` : ""}
        <button class="btn primary" data-taxicard="1">택시 기사에게 보여줄 화면</button>
        ${t.gmap ? `<a class="btn" href="${esc(t.gmap)}" target="_blank" rel="noopener">구글맵으로 위치 보기</a>` : ""}
      </div>
      <div class="say"><p class="eyebrow">호텔 프런트에서 택시 불러달라고 할 때</p>
        ${sayBox("Excuse me, could you call a taxi for us, please? A large one if possible — there are four of us with luggage.", "Perdone, ¿nos podría pedir un taxi, por favor? Uno grande si es posible: somos cuatro con maletas.", "실례합니다, 택시 좀 불러주실 수 있나요? 가능하면 큰 차로요. 4명이고 짐이 있어요.")}</div>
      <div class="say"><p class="eyebrow">식당에서 계산하면서 택시 부탁할 때</p>
        ${sayBox("Could you call a taxi for us, please? There are four of us.", "¿Nos podría pedir un taxi, por favor? Somos cuatro.", "택시 좀 불러주실 수 있나요? 4명이에요.")}</div>
      <p class="note">4명이 짐과 함께 타면 일반 택시는 좁을 수 있어요. 우버에서는 큰 차(XL)를 고르면 돼요.</p></div>`;
    $("#ride").hidden = false; $("#ride .close").focus();
  }
  function taxiCards(list, title) {
    if (!list.length) return "";
    return `<div class="card"><p class="eyebrow">${esc(title)}</p>${list.map(t => `<div class="h2" style="font-size:18px">${esc(D.dates[t.day - 1])} ${ap(t.time)} → ${esc(t.dest)}</div>
      <div class="muted">${esc(t.when)}</div><div class="grid2" style="margin-top:10px"><button class="btn primary" data-taxiplan="${D.taxiplan.indexOf(t)}">프런트에 보여주기</button><button class="btn" data-copy="${esc(t.en)}">영어 문장 복사</button></div>`).join("")}</div>`;
  }
  function openTaxiPlan(i) {
    const t = D.taxiplan[i]; if (!t) return;
    $("#ride").hidden = true;
    $("#taxi").innerHTML = `<div class="wrap"><button class="btn close" data-close="taxi">닫기</button>
      <p class="eyebrow">프런트 직원에게 보여주세요</p>
      ${sayBox(t.en, t.es, t.ko, { big: true, copy: true })}
      <div class="say" style="background:var(--surface-2);border-radius:14px;padding:14px"><div class="muted">${esc(t.hotel)} → ${esc(t.dest)}</div><div style="margin-top:6px">${esc(t.tip)}</div></div>
      <p class="note" style="margin:0">숙소에 앱 메시지로 보낼 때는 영어 복사 버튼을 누른 뒤 붙여넣으세요.</p></div>`;
    $("#taxi").hidden = false; $("#taxi .close").focus();
  }
  function openTaxi(t) {
    $("#taxi").innerHTML = `<div class="wrap"><button class="btn close" data-close="taxi">닫기</button>
      ${sayBox("Hi! Could you take us to this address, please?", "¡Hola! ¿Nos lleva a esta dirección, por favor?", "", { big: true })}
      <div class="big">${esc(t.name)}</div>${t.addr ? `<div class="big addr" style="font-size:26px">${esc(t.addr)}</div>` : ""}
      <div class="ko">기사님께 이 화면을 보여주세요</div></div>`;
    $("#ride").hidden = true; $("#taxi").hidden = false; $("#taxi .close").focus();
  }

  /* ---------- 앱 화면 전체 확대 막기 ----------
     아이폰은 두 손가락 · 두 번 톡으로 화면 전체를 확대하면 고정된 머리띠 · 하단 바 구조에서 엉뚱한 곳(오른쪽 위)을 크게 보여줌.
     지도는 지도 안에서 따로 확대 · 축소함. */
  ["gesturestart", "gesturechange", "gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener("touchmove", e => { if (e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });

  /* ---------- 탭 ---------- */
  const VIEWS = ["today", "plan", "wallet", "food", "more"];
  const RENDER = { today: renderToday, plan: renderPlan, wallet: renderWallet, food: renderFood, more: renderMore };
  const scrollMem = {}; let curView = null;
  // 맨 위 제목: 탭 방향으로 밀려 바뀜 (오른쪽 탭 → 지금 제목은 왼쪽으로 빠지고 새 제목은 오른쪽에서). 두 제목이 겹쳐 움직여서 비는 순간 없음
  function swapTitle(text, dir) {
    const h = $("#title"); if (!h) return;
    if (REDUCE || !dir || !h.animate || h.textContent === text) { h.textContent = text; return; }
    h.parentNode.querySelectorAll(".ghost").forEach(g => g.remove());
    const old = h.cloneNode(true); old.removeAttribute("id"); old.classList.add("ghost"); old.setAttribute("aria-hidden", "true");
    h.parentNode.appendChild(old);
    h.textContent = text;
    const ease = "cubic-bezier(.33, 1, .68, 1)";   // 차분하게 감속 (튕김 없음)
    old.animate([{ transform: "none", opacity: 1 }, { transform: `translateX(${-dir * 4}px)`, opacity: 0 }], { duration: 140, easing: "ease-out", fill: "forwards" });
    h.animate([{ transform: `translateX(${dir * 8}px)`, opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 260, easing: ease });
    setTimeout(() => old.remove(), 260);
  }
  function moveInd(v, instant) {
    const ind = $(".tabs .ind"), b = $(`.tabs button[data-tab="${v}"]`); if (!ind || !b) return;
    if (instant) ind.classList.add("noanim");
    ind.style.width = b.offsetWidth + "px"; ind.style.transform = `translateX(${b.offsetLeft}px)`;
    if (instant) { void ind.offsetWidth; ind.classList.remove("noanim"); }
  }
  // 앱 높이를 실제 보이는 화면 높이에 맞추고, 하단 바가 화면 바닥보다 떠 있으면 바닥에 붙이기 (아이폰 기종 · 상황별 차이 보정)
  addEventListener("resize", () => { if (curView) moveInd(curView, true); });
  // 화면 전체는 항상 맨 위에 고정 (스크롤은 탭 화면 안에서만)
  // 아이폰 맨 위 시계(상태바)를 톡 → 지금 보는 탭을 맨 위로.
  // 아이폰은 시계를 누르면 '문서'를 맨 위로 올림 → 문서를 1px 내려두고(park), 0이 되는 순간 지금 탭을 맨 위로 올린 뒤 다시 1px 내려둠
  let parking = false;
  const park = () => { if (window.scrollY !== 1) { parking = true; window.scrollTo(0, 1); requestAnimationFrame(() => requestAnimationFrame(() => { parking = false; })); } };
  const viewTop = () => { const v = curView && $("#v-" + curView); if (v && v.scrollTop > 0) v.scrollTo({ top: 0, behavior: REDUCE ? "auto" : "smooth" }); };
  addEventListener("scroll", () => {
    if (parking) return;
    if (window.scrollY <= 0) { viewTop(); setTimeout(park, 350); }
    else if (window.scrollY !== 1) park();
  }, { passive: true });
  addEventListener("pageshow", () => setTimeout(park, 50));
  setTimeout(park, 0); setTimeout(park, 600);
  // 앱 맨 위 머리띠(제목 · 시계)를 눌러도 맨 위로
  $(".top").addEventListener("click", viewTop);
  // 여행 중에는 일정 · 티켓 · 식당 탭을 열 때 '지금'에 맞는 날짜와 끼니로 맞춤 (직접 고른 지 10분이 안 지났으면 그대로)
  const picked = { plan: 0, wallet: 0, food: 0 };
  function nowMealKey() {   // 오후 3시 전 → 오늘 점심, 그 뒤 → 오늘 저녁, 밤 9시 반 넘으면 → 내일 점심 (없으면 다음 끼니)
    const { idx, now } = tripDay();
    const di = now >= 21 * 60 + 30 ? idx + 1 : idx, target = di * 2 + (now >= 15 * 60 && now < 21 * 60 + 30 ? 1 : 0);
    const ord = m => dayIdx(mealDate(m)) * 2 + (mealSlot(m) === "dinner" ? 1 : 0);
    const pick = D.meals.slice().sort((a, b) => ord(a) - ord(b)).find(m => ord(m) >= target);
    return pick ? pick.key : null;
  }
  function autoPick(v) {
    const { idx } = tripDay();
    if (!(v in picked) || idx < 1 || idx > 10 || Date.now() - picked[v] < 10 * 60e3) return false;
    if (v === "plan") planDay = idx;
    else if (v === "wallet") walletDay = null;   // 오늘(없으면 다음 날) 티켓
    else if (v === "food") mealKey = nowMealKey() || mealKey;
    return true;
  }
  function show(v, fromTab) {
    if (!VIEWS.includes(v)) v = "today";
    if (fromTab && v === curView) { $("#v-" + v).scrollTo({ top: 0, behavior: REDUCE ? "auto" : "smooth" }); return; }   // 같은 탭 한 번 더 → 맨 위로
    if (curView) scrollMem[curView] = $("#v-" + curView).scrollTop;
    VIEWS.forEach(x => { $("#v-" + x).hidden = x !== v; });
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === v ? "page" : "false"));
    moveInd(v, !curView);
    swapTitle(TITLES[v], curView ? Math.sign(VIEWS.indexOf(v) - VIEWS.indexOf(curView)) : 0);
    destroyMaps();
    delete lastKey["v-" + v];
    const auto = autoPick(v);
    RENDER[v]();
    $("#v-" + v).scrollTop = fromTab && v !== "more" && !auto ? (scrollMem[v] || 0) : 0;   // 더보기는 항상 접힌 채 맨 위부터
    curView = v;
    if (auto && v === "plan") { const nowEl = $("#v-plan .ev.now"); if (nowEl) reveal(nowEl, false); }   // 지금 일정이 보이게
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("button, a");
    if (!b) { const ev = e.target.closest("[data-route]"); if (ev) showRoute(ev); return; }
    const ds = b.dataset;
    if (ds.tab) show(ds.tab, true);
    else if (ds.go) show(ds.go);
    else if (ds.plan) { planDay = +ds.plan; picked.plan = Date.now(); show("plan"); }
    else if (ds.day) { planDay = +ds.day; picked.plan = Date.now(); destroyMaps(); renderPlan(); }
    else if (ds.fly) { const [fd, fi, fk] = ds.fly.split(":"); const m = MAPS[fd + ":v-plan"] || MAPS[fd + ":v-today"]; if (m) m.fly(+fi, fk === undefined ? -1 : +fk); }
    else if (ds.taxiplan !== undefined) openTaxiPlan(+ds.taxiplan);
    else if (ds.meal) { mealKey = ds.meal; picked.food = Date.now(); if ($("#v-food").hidden) show("food"); else renderFood(); }
    else if (ds.wday) { walletDay = +ds.wday; picked.wallet = Date.now(); if ($("#v-wallet").hidden) show("wallet"); else renderWallet(); }
    else if (ds.install) { if (window.__showInstall) window.__showInstall(); }
    else if (ds.tf) { document.documentElement.dataset.tf = ds.tf; store.set("tf", ds.tf); renderMore(); }
    else if (ds.ride) openRide(ds.ride);
    else if (ds.taxicard) { if (rideCur) openTaxi(rideCur); }
    else if (ds.close) $("#" + ds.close).hidden = true;
    else if (ds.lang) { const es = b.closest(".say2").querySelector(".es2"); es.hidden = !es.hidden; b.setAttribute("aria-pressed", String(!es.hidden)); b.textContent = es.hidden ? "🇪🇸 스페인어" : "스페인어 숨기기"; }
    else if (ds.fx) { const e = $("#fx-eur"); if (e) { e.value = ds.fx; fxCalc("eur"); } }
    else if (ds.copy !== undefined) copy(ds.copy, b);
  });
  document.addEventListener("input", e => { if (e.target.id === "fx-eur") fxCalc("eur"); else if (e.target.id === "fx-krw") fxCalc("krw"); });
  // 인터넷 끊기면 맨 위에 '오프라인' 배지 · 다시 연결되면 날씨 새로 받기
  const netUpd = () => { const o = $("#offl"); if (o) o.hidden = navigator.onLine !== false; };
  addEventListener("offline", netUpd);
  addEventListener("online", () => { netUpd(); if (curView === "today" || curView === "plan") fillWx($("#v-" + curView)); });
  netUpd();
  document.addEventListener("change", e => {
    const c = e.target.closest("[data-check]"); if (!c) return;
    const all = store.get("checks", {}); all[c.dataset.check] = c.checked; store.set("checks", all);
  });
  function showRoute(el) {
    const [d, p, k] = el.dataset.route.split(":").map(Number);
    const m = MAPS[d + ":v-plan"]; if (!m) return;
    el.closest(".tl").querySelectorAll(".ev.on").forEach(x => x.classList.remove("on")); el.classList.add("on");
    m.route(p, k);
  }
  document.addEventListener("keydown", e => { const ev = e.target.closest && e.target.closest("[data-route]"); if (ev && (e.key === "Enter" || e.key === " ") && e.target === ev) { e.preventDefault(); showRoute(ev); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape") ["taxi", "ride"].forEach(id => $("#" + id).hidden = true); });

  { const tf = store.get("tf", null); if (tf && (D.titleOpts || []).some(t => t.id === tf)) document.documentElement.dataset.tf = tf; }
  tick(); setInterval(() => { tick(); }, 30000);
  const h = location.hash.replace("#", "");
  ["tab", "planDay", "meal", "walletDay"].forEach(k => { try { localStorage.removeItem("es26:" + k); } catch (e) {} });   // 예전 버전이 남긴 위치 기록 정리
  show(VIEWS.includes(h) ? h : "today");
})();
</script>
</template>
<script>
(() => {
  const KEY = "es26:key", BUILD = "42e24bc502";
  const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const tob64 = u => btoa(String.fromCharCode(...u));
  const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const put = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (navigator.standalone === true || matchMedia("(display-mode: standalone)").matches) document.getElementById("lockhelp").hidden = true;   // 이미 설치된 앱에서는 설치 안내 숨김
  let ENC = null;
  async function loadEnc() {
    if (!ENC) ENC = await (await fetch("data.enc", { cache: "no-cache" })).json();
    return ENC;
  }
  async function derive(pw, enc) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: ub64(enc.salt), iterations: enc.iter }, base, 256));
  }
  async function open(raw, enc) {
    const k = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ub64(enc.iv) }, k, ub64(enc.ct));
    const stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(stream).text();
  }
  function boot(json) {
    document.getElementById("lock").hidden = true;
    const frag = document.getElementById("appshell").content.cloneNode(true);
    const scripts = [...frag.querySelectorAll("script")];
    scripts.forEach(s => s.remove());
    document.body.appendChild(frag);
    scripts.forEach(s => {
      const n = document.createElement("script");
      if (s.id === "data") { n.id = "data"; n.type = "application/json"; n.textContent = json; }
      else n.textContent = s.textContent;
      document.body.appendChild(n);
    });
    if (window.__autoInstall) window.__autoInstall();
  }
  async function start() {
    let enc;
    try { enc = await loadEnc(); } catch (e) { showLock("인터넷에 연결된 상태에서 처음 한 번 열어주세요"); return; }
    if (enc.build && enc.build !== BUILD) {   // 화면이 옛 버전이면 한 번만 새로 받기
      let done = null; try { done = sessionStorage.getItem("es26:reload"); } catch (e) {}
      if (done !== enc.build) { try { sessionStorage.setItem("es26:reload", enc.build); } catch (e) {} location.replace(location.pathname + "?v=" + enc.build); return; }
    }
    const saved = get(KEY);
    if (saved) { try { boot(await open(ub64(saved), enc)); return; } catch (e) { put(KEY, null); } }
    showLock("");
  }
  function showLock(msg) {
    document.getElementById("lock").hidden = false;
    document.getElementById("err").textContent = msg;
    setTimeout(() => document.getElementById("pw").focus(), 50);
  }
  document.getElementById("lockform").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = document.getElementById("go"), err = document.getElementById("err");
    btn.disabled = true; btn.textContent = "여는 중…"; err.textContent = "";
    try {
      const enc = await loadEnc();
      const raw = await derive(document.getElementById("pw").value.trim(), enc);
      const json = await open(raw, enc);
      if (document.getElementById("remember").checked) put(KEY, tob64(raw));
      boot(json);
    } catch (x) {
      err.textContent = "비밀번호가 맞지 않아요";
      btn.disabled = false; btn.textContent = "열기";
    }
  });
  start();
})();
</script>
